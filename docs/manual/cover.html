<div class="cover">

  <div class="cover-body">
    <img class="cover-logo" src="{{logo}}" alt="MES Group">
    <div class="cover-kicker">User manual</div>
    <div class="cover-title">MES AR Automation</div>

    </div>
  </div>
</div>
